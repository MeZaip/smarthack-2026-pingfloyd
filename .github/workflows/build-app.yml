# Builds the double-click desktop app for Windows (netcheck.exe) and macOS (netcheck.app).
# Run it from the Actions tab ("Run workflow") or by pushing a tag like app-v1.0.0.
# The files appear under the run's "Artifacts".
name: build-app

on:
  workflow_dispatch:
  push:
    tags: ["app-v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.22.0
      - name: Install psutil (network detection on Windows)
        if: runner.os == 'Windows'
        run: python -m pip install psutil
      - name: Tests
        run: python -m pytest -q
      - name: Build
        run: pyinstaller --noconfirm packaging/netcheck.spec
      - name: Zip the macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/netcheck.app dist/netcheck-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: netcheck-${{ runner.os }}
          path: |
            dist/netcheck.exe
            dist/netcheck-mac.zip
          if-no-files-found: ignore
