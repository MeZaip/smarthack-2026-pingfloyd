<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetCheck</title>
{% block head %}{% endblock %}
<style>
:root{--bg:#f7f7fb;--card:#fff;--ink:#16161d;--muted:#4a4a57;--line:#d9d9e3;--accent:#5b2a9e;
--good:#1d6b34;--good-bg:#e3f4e8;--warn:#8a5100;--warn-bg:#fff1d6;--bad:#a1121b;--bad-bg:#fde3e4;--info-bg:#e8eefc;--info:#1f3f8f}
@media (prefers-color-scheme:dark){:root{--bg:#121218;--card:#1c1c25;--ink:#f1f1f6;--muted:#b9b9c8;--line:#34343f;--accent:#c7a6ff;
--good:#8fe0a6;--good-bg:#173823;--warn:#ffd28a;--warn-bg:#3a2a0c;--bad:#ffaaae;--bad-bg:#43161a;--info-bg:#1c2846;--info:#b5c9ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)} a:focus,button:focus,input:focus,summary:focus{outline:3px solid var(--accent);outline-offset:2px}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
header strong{font-size:20px;margin-right:auto} nav a{margin-left:14px;font-weight:600}
main{max-width:1050px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin:16px 0}
h1{font-size:26px;margin:.2em 0} h2{font-size:22px;margin:.2em 0 .6em} h3{font-size:19px;margin:.3em 0}
.muted{color:var(--muted)} .small{font-size:16px}
.hero{display:grid;grid-template-columns:minmax(200px,260px) 1fr;gap:16px}
@media(max-width:700px){.hero{grid-template-columns:1fr}}
.score{border-radius:12px;padding:16px;text-align:center}
.score .num{font-size:64px;font-weight:800;line-height:1}
.good{background:var(--good-bg);color:var(--good)} .warn{background:var(--warn-bg);color:var(--warn)}
.bad{background:var(--bad-bg);color:var(--bad)} .err{background:var(--bad-bg);color:var(--bad)}
.sev{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:700;font-size:16px}
.sev-high{background:var(--bad-bg);color:var(--bad)} .sev-medium{background:var(--warn-bg);color:var(--warn)}
.sev-low{background:var(--info-bg);color:var(--info)} .sev-info{background:var(--info-bg);color:var(--info)}
.fixfirst{border:3px solid var(--bad);}
table{border-collapse:collapse;width:100%;font-size:16px} th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
.scroll{overflow-x:auto}
ol li{margin:.25em 0} code,.ev{font-family:ui-monospace,Menlo,monospace;font-size:16px;word-break:break-word}
button,.btn{font:inherit;font-weight:700;background:var(--accent);color:var(--card);border:0;border-radius:8px;padding:10px 18px;cursor:pointer;text-decoration:none;display:inline-block}
button.danger{background:var(--bad)}
input[type=text]{font:inherit;width:100%;padding:10px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
details summary{cursor:pointer;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.house{margin-top:8px}
.roof{height:70px;background:var(--accent);clip-path:polygon(50% 0,100% 100%,0 100%);display:flex;align-items:flex-end;justify-content:center;font-size:30px;padding-bottom:4px}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;border:4px solid var(--ink);border-top:0;padding:12px;background:var(--bg)}
.room{border:3px solid var(--line);border-radius:10px;padding:10px;background:var(--card);position:relative}
.room.front{grid-column:1/-1}.room.lvl-high{border-color:var(--bad)}.room.lvl-medium{border-color:var(--warn)}.room.lvl-ok{border-color:var(--good)}
.room.start{border-width:6px;box-shadow:0 0 0 4px var(--bad-bg)}
.badge-start{display:inline-block;background:var(--bad);color:var(--card);font-weight:800;border-radius:999px;padding:2px 12px;margin-bottom:4px}
.doors{list-style:none;padding:0;margin:6px 0}
.door{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;padding:4px 8px;border-radius:6px;margin:4px 0;border-left:8px solid var(--line);font-size:16px}
.door-high{background:var(--bad-bg);border-color:var(--bad)}.door-medium{background:var(--warn-bg);border-color:var(--warn)}
.door-low,.door-info{background:var(--info-bg);border-color:var(--info)}.door-resolved{background:var(--good-bg);border-color:var(--good)}
.door-none{border-color:var(--line)}
.proven{border:3px solid var(--good)} .sr{position:absolute;left:-9999px}
.cert{border:3px double var(--accent)}
@media print{header,nav,.noprint{display:none!important} body{background:#fff;color:#000;font-size:14px} .card{border:1px solid #999}}
</style>
</head>
<body>
<header>
  <strong>🛡️ {{ t.app }}</strong>
  <nav aria-label="main">
    <a href="/?lang={{ lang }}">{{ t.nav_home }}</a>
    <a href="/scan?lang={{ lang }}">{{ t.nav_scan }}</a>
    <a href="/guard?lang={{ lang }}">{{ t.nav_guard }}</a>
    <a href="/history?lang={{ lang }}">{{ t.nav_history }}</a>
    <a href="?lang={{ 'en' if lang=='ro' else 'ro' }}{% if scan_id %}&id={{ scan_id }}{% endif %}">🌐 {{ t.other_lang }}</a>
  </nav>
</header>
<main>
{% block body %}{% endblock %}
<p class="muted small">🔒 {{ t.privacy }}</p>
</main>
</body></html>
