<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080a">
  <title>netcheck</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main" data-i18n="skip">Skip to content</a>

  <div class="app">
    <!-- Navigation: a slim text rail on computers, a horizontal tab strip on phones. -->
    <nav class="nav" aria-label="Menu">
      <div class="nav-brand">
        <span class="brand-name">NET<b>CHECK</b></span>
        <span class="brand-line"><span class="live" aria-hidden="true"></span><span data-i18n="navLive">local monitoring</span></span>
      </div>
      <div class="nav-status" id="nav-status" aria-live="polite"></div>
      <div class="nav-list" id="nav-list">
        <span class="nav-indicator" id="nav-indicator" aria-hidden="true"></span>
        <button type="button" class="nav-item" data-tab="home"><span class="nav-num" aria-hidden="true">01</span><span class="nav-label" data-i18n="navHome">Home</span><span class="nav-badge" data-badge="home"></span><kbd class="nav-key" aria-hidden="true">1</kbd></button>
        <button type="button" class="nav-item" data-tab="devices"><span class="nav-num" aria-hidden="true">02</span><span class="nav-label" data-i18n="navDevices">Devices</span><span class="nav-badge" data-badge="devices"></span><kbd class="nav-key" aria-hidden="true">2</kbd></button>
        <button type="button" class="nav-item" data-tab="findings"><span class="nav-num" aria-hidden="true">03</span><span class="nav-label" data-i18n="navFindings">Fixes</span><span class="nav-badge" data-badge="findings"></span><kbd class="nav-key" aria-hidden="true">3</kbd></button>
        <button type="button" class="nav-item" data-tab="history"><span class="nav-num" aria-hidden="true">04</span><span class="nav-label" data-i18n="navHistory">History</span><span class="nav-badge" data-badge="history"></span><kbd class="nav-key" aria-hidden="true">4</kbd></button>
        <button type="button" class="nav-item" data-tab="ask"><span class="nav-num" aria-hidden="true">05</span><span class="nav-label" data-i18n="navAsk">Ask</span><span class="nav-badge" data-badge="ask"></span><kbd class="nav-key" aria-hidden="true">5</kbd></button>
      </div>
      <p class="nav-hint" data-i18n="navHint">Keys 1–5 or ↑ ↓ for the menu</p>
    </nav>

    <div class="content">
      <header class="appbar">
        <div class="appbar-title">
          <span class="appbar-name" data-i18n="appbarName">Security console</span>
          <label class="net-chip">
            <span class="sr" data-i18n="scanFile">Check shown</span>
            <select id="scan-select"></select>
          </label>
        </div>
        <div class="appbar-meta" aria-hidden="true"><span class="live"></span>LOCAL · OFFLINE · PRIVATE</div>
      </header>

      <main id="main" tabindex="-1">
        <section class="panel" id="panel-home"></section>
        <section class="panel" id="panel-devices" hidden></section>
        <section class="panel" id="panel-findings" hidden></section>
        <section class="panel" id="panel-history" hidden></section>
        <section class="panel" id="panel-ask" hidden></section>
      </main>

      <footer class="foot">
        <p data-i18n="footer">We keep nothing on the internet: everything you see stays on this computer.</p>
      </footer>
    </div>
  </div>

  <!-- Device details: a side sheet on computers, a bottom sheet on phones. -->
  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
    <div class="sheet-bar">
      <span class="sheet-handle" aria-hidden="true"></span>
      <button type="button" class="icon-btn" id="sheet-close"><span aria-hidden="true">X</span><span class="sr" data-i18n="close">Close</span></button>
    </div>
    <div id="sheet-body"></div>
  </dialog>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
